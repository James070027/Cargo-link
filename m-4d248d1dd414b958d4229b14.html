<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#B8892B">
<title>Sign in</title>
<style id="gate-style">
:root { --bg:#FAF6EC; --surface:#fff; --fg:#1F1810; --muted:#6B5D45; --line:#E8DDC3; --brand:#B8892B; --brand-fg:#fff; --signal:#D4B05F; --warn-bg:#FBF0CF; --warn-fg:#5B4310; }
@media (prefers-color-scheme: dark) { :root { --bg:#0B0907; --surface:#14110D; --fg:#F4EDE0; --muted:#B5A88F; --line:#3E3322; --brand:#D4B05F; --brand-fg:#1A1306; --signal:#D4B05F; --warn-bg:#2B2210; --warn-fg:#EBD79A; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif; font-size:16px; line-height:1.5; padding:16px; }
main { box-shadow:0 20px 50px rgba(0,0,0,.35); border-color:rgba(212,176,95,.4); border-radius:20px; width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:14px; }
h1 { margin:0; font-size:1.4rem; font-family: "Trebuchet MS", system-ui, sans-serif; }
p { margin:0; color:var(--muted); font-size:0.95rem; }
label { font-weight:600; font-size:0.85rem; }
input { width:100%; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; }
button { font:inherit; font-weight:700; padding:12px 18px; border:0; border-radius:12px; background:linear-gradient(135deg,#F3E3AE,#D9B85F 40%,#B88A2E 75%,#8F6A1E); color:#1A1306; cursor:pointer; }
button[disabled] { opacity:.6; cursor:wait; }
.road { height:5px; background: repeating-linear-gradient(90deg, var(--signal) 0 22px, transparent 22px 36px); }
.err { background:var(--warn-bg); color:var(--warn-fg); border-radius:8px; padding:10px 12px; font-size:0.9rem; }
.err[hidden] { display:none; }
:focus-visible { outline:3px solid var(--signal); outline-offset:2px; }
form { display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<main>
  <div class="road" aria-hidden="true"></div>
  <h1>Admin sign in</h1>
  <p>Type your access code and password to open the dashboard.</p>
  <form id="f">
    <div id="cf"><label for="ac">Access code</label>
    <input id="ac" type="password" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
    <p class="err" id="err" role="alert" hidden></p>
    <button id="go" type="submit">Open dashboard</button>
  </form>
</main>
